name: MoonBit quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest stable MoonBit on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install latest stable MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          Join-Path $HOME ".moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check all compilation targets
        run: moon check --target all --deny-warn

      - name: Check package metadata
        run: moon info

      - name: Reject generated source drift
        shell: bash
        run: git diff --exit-code

      - name: Run WebAssembly GC tests
        run: moon test --target wasm-gc --deny-warn

      - name: Run native tests
        run: moon test --target native --deny-warn

      - name: Run JavaScript tests
        run: moon test --target js --deny-warn

      - name: Build all targets
        run: moon build --target all --deny-warn
